            <a-text value="বিপদ: জরুরী প্রস্থানের পথে কোনো দিকনির্দেশক চিহ্ন বা সাইন নেই। অন্ধকার বা ধোঁয়ায় কর্মীরা পথ খুঁজে পাবে না।
প্রয়োজনীয় ব্যবস্থা: আলোকিত EXIT সাইন এবং দিকনির্দেশক তীর চিহ্ন বসান।
আইনি বিধান: বিএলএ ২০০৬, ধারা ৬২(গ)" 
                    position="-1.6 0.5 0.01" align="left" color="#ffffff" width="3.2" side="double" font="#bn-font">
            </a-text>
          </a-plane>
        </a-entity>
      </a-entity>

      <!-- HOTSPOT 3: First aid box empty -->
      <a-entity position="-1 -0.5 -3.5" hotspot
                geometry="primitive: sphere; radius: 0.18"
                material="color: #FF9800; emissive: #FF9800; emissiveIntensity: 0.3"
                animation__pulse="property: scale; to: 1.3 1.3 1.3; dur: 800; dir: alternate; loop: true">
        <a-text value="ফাঁকা ফার্স্ট এইড" position="0 0.4 0" align="center"
                color="#FFEB3B" width="2.5" side="double" font="#bn-font">
        </a-text>
        <a-entity class="info-panel" visible="false" position="0 -0.7 0">
          <a-plane color="#000000" opacity="0.85" width="3.5" height="2.5">
            <a-text value="বিপদ: প্রাথমিক চিকিৎসা বক্সে কোনো সরঞ্জাম/ওষুধ নেই। দুর্ঘটনার সময় তা ব্যবহারের অনুপযোগী।
ঝুঁকি স্তর: মাঝারি
প্রয়োজনীয় ব্যবস্থা: সব ফার্স্ট এইড বক্স পূর্ণ রাখুন এবং মাসিক পরীক্ষা করুন। একজন প্রশিক্ষিত ফার্স্ট এইডার নিয়োগ করুন।
আইনি বিধান: কারখানা আইন ১৯৬৫, ধারা ২৮" 
                    position="-1.6 0.5 0.01" align="left" color="#ffffff" width="3.2" side="double" font="#bn-font">
            </a-text>
          </a-plane>
        </a-entity>
      </a-entity>

      <!-- Summary text -->
      <a-text value="আপনি মোট ১২টি ঝুঁকি পরিদর্শন করেছেন। প্রশিক্ষণ শেষ।" 
              position="0 0.5 -2.5" align="center" color="#4CAF50" width="5" side="double" font="#bn-font">
      </a-text>

      <!-- Back to scene 1 -->
      <a-entity position="-1 2.3 -3" class="clickable" nav-button
                geometry="primitive: plane; width: 1.5; height: 0.4"
                material="color: #2196F3">
        <a-text value="← পূর্ববর্তী" position="0 0 0.01" align="center"
                color="#ffffff" width="1.4" font="#bn-font">
        </a-text>
      </a-entity>
      <a-entity position="1 2.3 -3" class="clickable" restart-button
                geometry="primitive: plane; width: 1.5; height: 0.4"
                material="color: #9E9E9E">
        <a-text value="পুনরায় শুরু" position="0 0 0.01" align="center"
                color="#ffffff" width="1.4" font="#bn-font">
        </a-text>
      </a-entity>
    </a-entity>

    <!-- CAMERA + CURSOR -->
    <a-entity camera position="0 1.6 0" look-controls="pointerLockEnabled: false">
      <a-entity cursor="fuse: true; fuseTimeout: 500"
                position="0 0 -1"
                geometry="primitive: ring; radiusInner: 0.005; radiusOuter: 0.01"
                material="color: #ffffff; shader: flat">
      </a-entity>
    </a-entity>

    <a-light type="ambient" color="#ffffff" intensity="0.6"></a-light>
  </a-scene>

  <script>
    // Toggle info panels on click
    AFRAME.registerComponent('hotspot', {
      init: function () {
        this.el.addEventListener('click', function () {
          const panel = this.querySelector('.info-panel');
          if (panel) {
            const wasVisible = panel.getAttribute('visible');
            // Hide all info panels first
            document.querySelectorAll('.info-panel').forEach(function(p) {
              p.setAttribute('visible', false);
            });
            // Show only this one
            if (!wasVisible) {
              panel.setAttribute('visible', true);
            }
          }
        });
      }
    });

    // Scene navigation
    AFRAME.registerComponent('nav-button', {
      init: function () {
        this.el.addEventListener('click', function () {
          // Hide all scenes
          document.querySelectorAll('.scene').forEach(function(s) {
            s.setAttribute('visible', false);
          });
          
          // Determine target: find current scene, go forward or back
          const allScenes = ['scene1', 'scene2', 'scene3'];
          const current = this.closest('.scene');
          const currentId = current ? current.getAttribute('id') : 'scene1';
          const currentIndex = allScenes.indexOf(currentId);
          
          var targetId;
          // Check if this button has text "পরবর্তী" (next) or "পূর্ববর্তী" (previous)
          var btnText = this.querySelector('a-text');
          if (btnText && btnText.getAttribute('value').includes('পূর্ববর্তী')) {
            targetId = allScenes[Math.min(currentIndex - 1, 2)];
          } else {
            targetId = allScenes[Math.min(currentIndex + 1, 2)];
          }
          
          var target = document.getElementById(targetId);
          if (target) {
            target.setAttribute('visible', true);
            // Reset all info panels in new scene
            target.querySelectorAll('.info-panel').forEach(function(p) {
              p.setAttribute('visible', false);
            });
          }
        });
      }
    });

    // Restart button
    AFRAME.registerComponent('restart-button', {
      init: function () {
        this.el.addEventListener('click', function () {
          document.querySelectorAll('.scene').forEach(function(s) {
            s.setAttribute('visible', false);
          });
          document.getElementById('scene1').setAttribute('visible', true);
          document.querySelectorAll('.info-panel').forEach(function(p) {
            p.setAttribute('visible', false);
          });
        });
      }
    });

    console.log('NOSHTRI VR Training: Factory Hazard Identification loaded');
  </script>
</body>
</html>
