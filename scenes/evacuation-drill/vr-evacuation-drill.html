      <a-text value="অভিনন্দন!" position="0 3.0 -4" align="center" color="#FF6F00" font="#bengali-font-bold" width="6" side="double" scale="1.2 1.2 1.2"></a-text>
      <a-text value="আপনি অগ্নি নির্বাসন ড্রিল সফলভাবে সম্পন্ন করেছেন" position="0 2.2 -4" align="center" color="#ffffff" font="#bengali-font" width="6" side="double" scale="0.6 0.6 0.6"></a-text>
      <a-text value="Evacuation Drill Complete" position="0 1.5 -4" align="center" color="#FFB74D" font="#bengali-font" width="5" side="double" scale="0.5 0.5 0.5"></a-text>
      <a-text value="মূল্যায়ন - আপনার সিদ্ধান্তগুলি:" position="0 0.6 -4" align="center" color="#B0BEC5" font="#bengali-font-bold" width="5" side="double" scale="0.5 0.5 0.5"></a-text>
      <a-text value="ফায়ার অ্যালার্ম শুনে কাজ ফেলে সরেছেন -- সঠিক" position="0 -0.1 -4" align="center" color="#A5D6A7" font="#bengali-font" width="6" side="double" scale="0.4 0.4 0.4"></a-text>
      <a-text value="সবুজ EXIT চিহ্ন ও মেঝের চিহ্ন অনুসরণ করেছেন -- সঠিক" position="0 -0.55 -4" align="center" color="#81C784" font="#bengali-font" width="6" side="double" scale="0.4 0.4 0.4"></a-text>
      <a-text value="বাধাগ্রস্ত প্রস্থান দেখে বিকল্প পথ নিয়েছেন -- সঠিক" position="0 -1.0 -4" align="center" color="#81C784" font="#bengali-font" width="6" side="double" scale="0.4 0.4 0.4"></a-text>
      <a-text value="ধোঁয়া দেখে নিচু হয়ে/হামাগুড়ি দিয়ে এগিয়েছেন -- সঠিক" position="0 -1.45 -4" align="center" color="#81C784" font="#bengali-font" width="6" side="double" scale="0.4 0.4 0.4"></a-text>
      <a-text value="আহত সহকর্মীকে সাহায্য করেছেন, লিফট এড়িয়েছেন -- সঠিক" position="0 -1.9 -4" align="center" color="#A5D6A7" font="#bengali-font" width="6" side="double" scale="0.4 0.4 0.4"></a-text>
      <a-text value="নিরাপদ সমাবেশস্থলে পৌঁছে উপস্থিতি জানিয়েছেন -- সঠিক" position="0 -2.35 -4" align="center" color="#81C784" font="#bengali-font" width="6" side="double" scale="0.4 0.4 0.4"></a-text>
      <a-entity position="0 -3.0 -4" class="clickable" geometry="primitive: plane; width: 3.0; height: 0.6" material="color: #FF6F00; emissive: #FF6F00; emissiveIntensity: 0.15" animation__pulse="property: scale; to: 1.05 1.05 1.05; dur: 1200; dir: alternate; loop: true" nav-btn data-target="scene-intro"><a-text value="পুনরায় শুরু করুন" position="0 0 0.01" align="center" color="#ffffff" font="#bengali-font-bold" width="2.8" side="double" scale="0.5 0.5 0.5"></a-text></a-entity>

    <a-entity camera position="0 1.6 0" look-controls="pointerLockEnabled: false">
      <a-entity cursor="fuse: true; fuseTimeout: 600" position="0 0 -1" geometry="primitive: ring; radiusInner: 0.005; radiusOuter: 0.012" material="color: #ffffff; shader: flat">
        <a-animation attribute="scale" begin="fusing" end="fusing-done" from="1 1 1" to="12 12 1" dur="600"></a-animation>
      </a-entity>
    </a-entity>
    <a-light type="ambient" color="#ffffff" intensity="0.6"></a-light>

  </a-scene>

  <script>
    (function() {
      AFRAME.registerComponent('hotspot', {
        init: function () {
          var self = this;
          this.el.addEventListener('click', function () {
            var scene = self.el.closest('.scene');
            if (scene) {
              var panels = scene.querySelectorAll('.info-panel');
              for (var i = 0; i < panels.length; i++) {
                if (!self.el.contains(panels[i])) {
                  panels[i].setAttribute('visible', false);
                }
              }
            }
            var panel = self.el.querySelector('.info-panel');
            if (panel) {
              panel.setAttribute('visible', !panel.getAttribute('visible'));
            }
          });
        }
      });
      AFRAME.registerComponent('hazard', {
        init: function () {
          var self = this;
          var originalColor = this.el.getAttribute('material').color;
          this.el.addEventListener('click', function () {
            var scene = self.el.closest('.scene');
            if (scene) {
              var panels = scene.querySelectorAll('.info-panel');
              for (var i = 0; i < panels.length; i++) {
                if (!self.el.contains(panels[i])) {
                  panels[i].setAttribute('visible', false);
                }
              }
            }
            self.el.setAttribute('material', 'color', '#FF0000');
            self.el.setAttribute('material', 'emissive', '#FF0000');
            self.el.setAttribute('material', 'emissiveIntensity', '0.8');
            setTimeout(function () {
              self.el.setAttribute('material', 'color', originalColor);
              self.el.setAttribute('material', 'emissive', originalColor);
              self.el.setAttribute('material', 'emissiveIntensity', '0.3');
            }, 400);
            var panel = self.el.querySelector('.info-panel');
            if (panel) {
              panel.setAttribute('visible', !panel.getAttribute('visible'));
            }
          });
        }
      });
      AFRAME.registerComponent('nav-btn', {
        init: function () {
          var target = this.el.getAttribute('data-target');
          this.el.addEventListener('click', function () {
            navigateToScene(target);
          });
        }
      });
      AFRAME.registerComponent('scene-btn', {
        init: function () {
          var target = this.el.getAttribute('data-target');
          this.el.addEventListener('click', function () {
            navigateToScene(target);
          });
        }
      });
      function navigateToScene(sceneId) {
        var scenes = document.querySelectorAll('.scene');
        for (var i = 0; i < scenes.length; i++) {
          scenes[i].setAttribute('visible', false);
        }
        var target = document.getElementById(sceneId);
        if (target) {
          target.setAttribute('visible', true);
        }
        var camera = document.querySelector('[camera]');
        if (camera) {
          camera.setAttribute('rotation', '0 0 0');
        }
        console.log('Navigated to scene:', sceneId);
      }
      var tourActive = false;
      var tourTimer = null;
      var tourStep = 0;
      var tourItinerary = [
        ["scene-1", -45, 6, true],
        ["scene-1", 30, 5, true],
        ["scene-1", 135, 5, true],
        ["scene-2", -30, 6, true],
        ["scene-2", 60, 5, true],
        ["scene-2", -120, 5, true],
        ["scene-3", -60, 6, true],
        ["scene-3", 30, 5, true],
        ["scene-3", 120, 5, true],
        ["scene-4", 180, 6, true],
        ["scene-4", 90, 5, true],
        ["scene-4", 270, 5, true],
        ["scene-complete", 0, 6, false]
      ];
      function startAutoTour() {
        if (tourActive) return;
        tourActive = true;
        tourStep = 0;
        document.getElementById('auto-tour-btn').setAttribute('material', 'color', '#757575');
        var tourText = document.querySelector('#auto-tour-btn a-text');
        if (tourText) tourText.setAttribute('value', '\u23F9 \u09A5\u09BE\u09AE\u09BE\u09A8');
        runTourStep();
      }
      function runTourStep() {
        if (!tourActive) return;
        if (tourStep >= tourItinerary.length) { stopAutoTour(); return; }
        var step = tourItinerary[tourStep];
        var sceneId = step[0], rotY = step[1], delay = step[2] * 1000, clickHotspot = step[3];
        navigateToScene(sceneId);
        setTimeout(function() {
          if (!tourActive) return;
          var cam = document.querySelector('[camera]');
          if (cam) cam.setAttribute('rotation', '0 ' + rotY + ' 0');
        }, 300);
        if (clickHotspot) {
          setTimeout(function() {
            if (!tourActive) return;
            var scene = document.getElementById(sceneId);
            if (scene) {
              var hotspots = scene.querySelectorAll('[hotspot], [hazard]');
              if (hotspots.length > 0) {
                var idx = tourStep % hotspots.length;
                hotspots[idx].dispatchEvent(new MouseEvent('click', {bubbles: true}));
              }
            }
          }, 1500);
        }
        tourTimer = setTimeout(function() { tourStep++; runTourStep(); }, delay);
        var tourText = document.querySelector('#auto-tour-btn a-text');
        if (tourText) tourText.setAttribute('value', '\u23F9 \u09A5\u09BE\u09AE\u09BE\u09A8 (' + (tourStep+1) + '/' + tourItinerary.length + ')');
      }
      function stopAutoTour() {
        tourActive = false;
        if (tourTimer) { clearTimeout(tourTimer); tourTimer = null; }
        document.getElementById('auto-tour-btn').setAttribute('material', 'color', '#4CAF50');
        var tourText = document.querySelector('#auto-tour-btn a-text');
        if (tourText) tourText.setAttribute('value', '\uD83D\uDD04 \u0985\u099F\u09CB \u099F\u09CD\u09AF\u09C1\u09B0');
      }
      AFRAME.registerComponent('auto-tour', {
        init: function () {
          this.el.addEventListener('click', function () {
            if (!tourActive) startAutoTour(); else stopAutoTour();
          });
        }
      });
      document.getElementById('auto-tour-btn').setAttribute('auto-tour', '');
      console.log('Evacuation Drill VR loaded');
    })();
  </script>
</body>
</html>
