<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>অগ্নি নিরাপত্তা মৌলিক বিষয় — NOSHTRI VR</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/aframe/1.6.0/aframe.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; overflow: hidden; font-family: 'Noto Sans Bengali', 'Inter', sans-serif; }
    .a-canvas { width: 100% !important; height: 100% !important; }
  </style>
</head>
<body>
  <a-scene>

    <!-- ═══ ASSETS ═══ -->
    <a-assets>
      <!-- Skybox images (relative to HTML file) -->
      <img id="sky-intro" src="assets/intro-bg.jpg" crossorigin="anonymous">
      <img id="sky-extinguisher" src="assets/fire-extinguisher-area.jpg" crossorigin="anonymous">
      <img id="sky-evacuation" src="assets/evacuation-route.jpg" crossorigin="anonymous">
      <img id="sky-hazards" src="assets/fire-hazards.jpg" crossorigin="anonymous">

      <!-- Bengali font via A-Frame asset item -->
      <a-asset-item id="bengali-font" src="https://cdn.jsdelivr.net/gh/AwesomePixels/noto-sans-bengali@main/NotoSansBengali-Regular.woff2"></a-asset-item>
      <a-asset-item id="bengali-font-bold" src="https://cdn.jsdelivr.net/gh/AwesomePixels/noto-sans-bengali@main/NotoSansBengali-Bold.woff2"></a-asset-item>
    </a-assets>

    <!-- ════════════════════════════════════════════════════ -->
    <!-- SCENE INTRO — শিরোনাম + 360° ব্যাকগ্রাউন্ড -->
    <!-- ════════════════════════════════════════════════════ -->
    <a-entity id="scene-intro" class="scene" visible="true">
      <a-sky src="#sky-intro" rotation="0 -90 0"></a-sky>

      <!-- Dark overlay for readability -->
      <a-plane position="0 0 -4" width="8" height="6" color="#000000" opacity="0.55" side="double"></a-plane>

      <!-- NOSHTRI Logo -->
      <a-text value="🥽 NOSHTRI VR" position="0 3.2 -3.8" align="center" color="#FF6F00"
              font="#bengali-font-bold" width="6" side="double" scale="1.2 1.2 1.2"></a-text>

      <!-- Main title -->
      <a-text value="অগ্নি নিরাপত্তা" position="0 2.0 -3.8" align="center" color="#ffffff"
              font="#bengali-font-bold" width="7" side="double" scale="1.4 1.4 1.4"></a-text>
      <a-text value="মৌলিক বিষয়" position="0 1.2 -3.8" align="center" color="#ffffff"
              font="#bengali-font-bold" width="7" side="double" scale="1.2 1.2 1.2"></a-text>

      <!-- English subtitle -->
      <a-text value="Fire Safety Basics" position="0 0.4 -3.8" align="center" color="#FFB74D"
              font="#bengali-font" width="6" side="double" scale="0.8 0.8 0.8"></a-text>

      <!-- Subtitle -->
      <a-text value="এই প্রশিক্ষণে আপনি শিখবেন:" position="0 -0.4 -3.8" align="center" color="#B0BEC5"
              font="#bengali-font" width="5" side="double" scale="0.65 0.65 0.65"></a-text>
      <a-text value="• অগ্নি নির্বাপক যন্ত্রের P.A.S.S. পদ্ধতি" position="0 -1.1 -3.8" align="center" color="#CFD8DC"
              font="#bengali-font" width="5" side="double" scale="0.55 0.55 0.55"></a-text>
      <a-text value="• জরুরি প্রস্থান ও উদ্ধার পথ" position="0 -1.6 -3.8" align="center" color="#CFD8DC"
              font="#bengali-font" width="5" side="double" scale="0.55 0.55 0.55"></a-text>
      <a-text value="• অগ্নি ঝুঁকি শনাক্তকরণ" position="0 -2.1 -3.8" align="center" color="#CFD8DC"
              font="#bengali-font" width="5" side="double" scale="0.55 0.55 0.55"></a-text>

      <!-- Start button (manual) -->
      <a-entity position="-1.4 -3.0 -3.8" class="clickable"
                geometry="primitive: plane; width: 1.8; height: 0.65"
                material="color: #FF6F00; emissive: #FF6F00; emissiveIntensity: 0.15"
                animation__pulse="property: scale; to: 1.05 1.05 1.05; dur: 1200; dir: alternate; loop: true"
                data-target="scene-1"
                scene-btn>
        <a-text value="শুরু করুন ▶" position="0 0 0.01" align="center" color="#ffffff"
                font="#bengali-font-bold" width="1.7" side="double" scale="0.55 0.55 0.55"></a-text>
      </a-entity>

      <!-- Auto-Tour button -->
      <a-entity position="1.4 -3.0 -3.8" class="clickable"
                geometry="primitive: plane; width: 1.8; height: 0.65"
                material="color: #4CAF50; emissive: #4CAF50; emissiveIntensity: 0.15"
                animation__pulse="property: scale; to: 1.05 1.05 1.05; dur: 1500; dir: alternate; loop: true"
                id="auto-tour-btn">
        <a-text value="🔄 অটো ট্যুর" position="0 0 0.01" align="center" color="#ffffff"
                font="#bengali-font-bold" width="1.7" side="double" scale="0.55 0.55 0.55"></a-text>
      </a-entity>

      <!-- Hint -->
      <a-text value="নীল বিন্দুতে gaze/ক্লিক করুন তথ্য দেখতে" position="0 -3.8 -3.8" align="center" color="#78909C"
              font="#bengali-font" width="5" side="double" scale="0.45 0.45 0.45"></a-text>

      <!-- Credit -->
      <a-text value="ILO Bangladesh — NOSHTRI" position="0 -4.3 -3.8" align="center" color="#546E7A"
              font="#bengali-font" width="5" side="double" scale="0.4 0.4 0.4"></a-text>
    </a-entity>


    <!-- ════════════════════════════════════════════════════ -->
    <!-- SCENE 1 — অগ্নি নির্বাপক স্টেশন (PASS পদ্ধতি) -->
    <!-- ════════════════════════════════════════════════════ -->
    <a-entity id="scene-1" class="scene" visible="false">
      <a-sky src="#sky-extinguisher" rotation="0 -60 0"></a-sky>

      <!-- Scene title -->
      <a-text value="দৃশ্য ১: অগ্নি নির্বাপক স্টেশন" position="0 2.8 -2.8" align="center" color="#ffffff"
              font="#bengali-font-bold" width="6" side="double" scale="0.8 0.8 0.8"></a-text>
      <a-text value="Fire Extinguisher Station — P.A.S.S. Method" position="0 2.2 -2.8" align="center" color="#FFB74D"
              font="#bengali-font" width="5" side="double" scale="0.5 0.5 0.5"></a-text>

      <!-- HOTSPOT 1: P — Pull the pin (PIN টানুন) -->
      <a-entity position="-3.0 0.5 -3.5" class="clickable"
                geometry="primitive: sphere; radius: 0.18"
                material="color: #F44336; emissive: #F44336; emissiveIntensity: 0.25"
                animation__pulse="property: scale; to: 1.2 1.2 1.2; dur: 1000; dir: alternate; loop: true"
                hotspot>
        <a-text value="P — পিন টানুন" position="0 0.5 0" align="center" color="#FFEB3B"
                font="#bengali-font" width="3" side="double" scale="0.6 0.6 0.6"></a-text>
        <a-entity class="info-panel" visible="false" position="0 -0.7 0">
          <a-plane color="#1a1a2e" opacity="0.92" width="3.2" height="2.2">
            <a-text value="PULL (পিন টানুন)
অগ্নি নির্বাপকের উপরের
সুরক্ষা পিনটি টেনে বের
করুন। এটি নির্বাপককে
ব্যবহারের জন্য প্রস্তুত
করে।" position="-1.4 0.6 0.01" align="left" color="#ffffff"
                    font="#bengali-font" width="2.8" side="double" scale="0.5 0.5 0.5"></a-text>
          </a-plane>
        </a-entity>
      </a-entity>

      <!-- HOTSPOT 2: A — Aim at the base (নিচে লক্ষ্য করুন) -->
      <a-entity position="2.0 0.3 -3.2" class="clickable"
                geometry="primitive: sphere; radius: 0.18"
                material="color: #F44336; emissive: #F44336; emissiveIntensity: 0.25"
                animation__pulse="property: scale; to: 1.2 1.2 1.2; dur: 1000; dir: alternate; loop: true"
                hotspot>
        <a-text value="A — নিচে লক্ষ্য করুন" position="0 0.5 0" align="center" color="#FFEB3B"
                font="#bengali-font" width="3" side="double" scale="0.6 0.6 0.6"></a-text>
        <a-entity class="info-panel" visible="false" position="0 -0.7 0">
          <a-plane color="#1a1a2e" opacity="0.92" width="3.2" height="2.2">
            <a-text value="AIM (নিচে লক্ষ্য করুন)
নির্বাপকের নজলটি আগুনের
গোড়ার দিকে নির্দেশ করুন।
আগুনের শিখার উপরে নয়,
গোড়ায় স্প্রে করতে হবে।" position="-1.4 0.6 0.01" align="left" color="#ffffff"
                    font="#bengali-font" width="2.8" side="double" scale="0.5 0.5 0.5"></a-text>
          </a-plane>
        </a-entity>
      </a-entity>

      <!-- HOTSPOT 3: S — Squeeze (চাপ দিন) -->
      <a-entity position="-1.5 -0.3 -3.8" class="clickable"
                geometry="primitive: sphere; radius: 0.18"
                material="color: #F44336; emissive: #F44336; emissiveIntensity: 0.25"
                animation__pulse="property: scale; to: 1.2 1.2 1.2; dur: 1000; dir: alternate; loop: true"
                hotspot>
        <a-text value="S — চাপ দিন" position="0 0.5 0" align="center" color="#FFEB3B"
                font="#bengali-font" width="3" side="double" scale="0.6 0.6 0.6"></a-text>
        <a-entity class="info-panel" visible="false" position="0 -0.7 0">
          <a-plane color="#1a1a2e" opacity="0.92" width="3.2" height="2.2">
            <a-text value="SQUEEZE (চাপ দিন)
হ্যান্ডেলটি শক্ত করে চাপ
দিয়ে নির্বাপক পদার্থ
ছাড়ুন। নিয়ন্ত্রিত ভাবে
ছাড়ুন — যেন একবারে শেষ
না হয়ে যায়।" position="-1.4 0.6 0.01" align="left" color="#ffffff"
                    font="#bengali-font" width="2.8" side="double" scale="0.5 0.5 0.5"></a-text>
          </a-plane>
        </a-entity>
      </a-entity>

      <!-- HOTSPOT 4: S — Sweep (পাশে চালান) -->
      <a-entity position="0.5 -0.2 -3.6" class="clickable"
                geometry="primitive: sphere; radius: 0.18"
                material="color: #F44336; emissive: #F44336; emissiveIntensity: 0.25"
                animation__pulse="property: scale; to: 1.2 1.2 1.2; dur: 1000; dir: alternate; loop: true"
                hotspot>
        <a-text value="S — পাশে চালান" position="0 0.5 0" align="center" color="#FFEB3B"
                font="#bengali-font" width="3" side="double" scale="0.6 0.6 0.6"></a-text>
        <a-entity class="info-panel" visible="false" position="0 -0.7 0">
          <a-plane color="#1a1a2e" opacity="0.92" width="3.2" height="2.2">
            <a-text value="SWEEP (পাশে চালান)
নজলটি এক পাশ থেকে অন্য
পাশে ঝাড়ুর মতো চালান।
আগুন পুরোপুরি নেভা পর্যন্ত
চালাতে থাকুন। সতর্ক থাকুন।" position="-1.4 0.6 0.01" align="left" color="#ffffff"
                    font="#bengali-font" width="2.8" side="double" scale="0.5 0.5 0.5"></a-text>
          </a-plane>
        </a-entity>
      </a-entity>

      <!-- HOTSPOT 5: Fire Alarm (নীল — তথ্য) -->
      <a-entity position="-2.0 1.8 -2.5" class="clickable"
                geometry="primitive: sphere; radius: 0.15"
                material="color: #2196F3; emissive: #2196F3; emissiveIntensity: 0.2"
                animation__pulse="property: scale; to: 1.2 1.2 1.2; dur: 1200; dir: alternate; loop: true"
                hotspot>
        <a-text value="ফায়ার অ্যালার্ম 🚨" position="0 0.5 0" align="center" color="#FFEB3B"
                font="#bengali-font" width="3" side="double" scale="0.55 0.55 0.55"></a-text>
        <a-entity class="info-panel" visible="false" position="0 -0.7 0">
          <a-plane color="#1a1a2e" opacity="0.92" width="3.2" height="2.2">
            <a-text value="ফায়ার অ্যালার্ম
• আগুন দেখলেই অ্যালার্ম টিপুন
• সবাইকে সতর্ক করুন
• নির্ধারিত স্থানে জড়ো হন
• লিফট ব্যবহার করবেন না
• সিঁড়ি ব্যবহার করুন" position="-1.4 0.6 0.01" align="left" color="#ffffff"
                    font="#bengali-font" width="2.8" side="double" scale="0.5 0.5 0.5"></a-text>
          </a-plane>
        </a-entity>
      </a-entity>

      <!-- Navigation buttons -->
      <a-entity position="-3.0 -2.5 -1.5" class="clickable"
                geometry="primitive: plane; width: 1.2; height: 0.4"
                material="color: #37474F; opacity: 0.7"
                nav-btn data-target="scene-intro">
        <a-text value="◀ পূর্ববর্তী" position="0 0 0.01" align="center" color="#ffffff"
                font="#bengali-font" width="1.1" side="double" scale="0.45 0.45 0.45"></a-text>
      </a-entity>
      <a-entity position="3.0 -2.5 -1.5" class="clickable"
                geometry="primitive: plane; width: 1.2; height: 0.4"
                material="color: #FF6F00; opacity: 0.85"
                nav-btn data-target="scene-2">
        <a-text value="পরবর্তী ▶" position="0 0 0.01" align="center" color="#ffffff"
                font="#bengali-font" width="1.1" side="double" scale="0.45 0.45 0.45"></a-text>
      </a-entity>
    </a-entity>


    <!-- ════════════════════════════════════════════════════ -->
    <!-- SCENE 2 — জরুরি প্রস্থান ও উদ্ধার পথ -->
    <!-- ════════════════════════════════════════════════════ -->
    <a-entity id="scene-2" class="scene" visible="false">
      <a-sky src="#sky-evacuation" rotation="0 -30 0"></a-sky>

      <!-- Scene title -->
      <a-text value="দৃশ্য ২: জরুরি প্রস্থান ও উদ্ধার পথ" position="0 2.8 -2.8" align="center" color="#ffffff"
              font="#bengali-font-bold" width="6" side="double" scale="0.8 0.8 0.8"></a-text>
      <a-text value="Evacuation Route & Emergency Exits" position="0 2.2 -2.8" align="center" color="#FFB74D"
              font="#bengali-font" width="5" side="double" scale="0.5 0.5 0.5"></a-text>

      <!-- HOTSPOT 1: Emergency Exit (সবুজ) -->
      <a-entity position="2.5 1.0 -3.5" class="clickable"
                geometry="primitive: sphere; radius: 0.16"
                material="color: #4CAF50; emissive: #4CAF50; emissiveIntensity: 0.2"
                animation__pulse="property: scale; to: 1.2 1.2 1.2; dur: 1100; dir: alternate; loop: true"
                hotspot>
        <a-text value="জরুরি প্রস্থান 🟢" position="0 0.45 0" align="center" color="#FFEB3B"
                font="#bengali-font" width="3" side="double" scale="0.55 0.55 0.55"></a-text>
        <a-entity class="info-panel" visible="false" position="0 -0.65 0">
          <a-plane color="#1a1a2e" opacity="0.92" width="3.2" height="2.0">
            <a-text value="জরুরি প্রস্থান (EXIT)
• সবুজ EXIT চিহ্ন অনুসরণ করুন
• প্রস্থানের পথ সবসময় পরিষ্কার
রাখুন
• দরজায় তালা দেওয়া যাবে না
• সব সময় প্রস্থানের অবস্থান
জানুন" position="-1.4 0.4 0.01" align="left" color="#ffffff"
                    font="#bengali-font" width="2.8" side="double" scale="0.5 0.5 0.5"></a-text>
          </a-plane>
        </a-entity>
      </a-entity>

      <!-- HOTSPOT 2: Floor markings (হলুদ) -->
      <a-entity position="-1.8 -0.5 -4.0" class="clickable"
                geometry="primitive: sphere; radius: 0.16"
                material="color: #FF9800; emissive: #FF9800; emissiveIntensity: 0.2"
                animation__pulse="property: scale; to: 1.2 1.2 1.2; dur: 1000; dir: alternate; loop: true"
                hotspot>
        <a-text value="উদ্ধার পথ নির্দেশিকা" position="0 0.45 0" align="center" color="#FFEB3B"
                font="#bengali-font" width="3" side="double" scale="0.55 0.55 0.55"></a-text>
        <a-entity class="info-panel" visible="false" position="0 -0.65 0">
          <a-plane color="#1a1a2e" opacity="0.92" width="3.2" height="2.0">
            <a-text value="উদ্ধার পথ নির্দেশিকা
• মেঝেতে তীর চিহ্ন অনুসরণ করুন
• সবুজ ফটোলুমিনেসেন্ট লাইন
• অন্ধকারেও দেখা যায়
• ধূমপানের সময় নিচু হয়ে/
হামাগুড়ি দিয়ে যান" position="-1.4 0.4 0.01" align="left" color="#ffffff"
                    font="#bengali-font" width="2.8" side="double" scale="0.5 0.5 0.5"></a-text>
          </a-plane>
        </a-entity>
      </a-entity>

      <!-- HOTSPOT 3: Assembly point (বেগুনি) -->
      <a-entity position="0.5 0.8 -3.0" class="clickable"
                geometry="primitive: sphere; radius: 0.16"
                material="color: #9C27B0; emissive: #9C27B0; emissiveIntensity: 0.2"
                animation__pulse="property: scale; to: 1.2 1.2 1.2; dur: 1300; dir: alternate; loop: true"
                hotspot>
        <a-text value="জড়ো হওয়ার স্থান 🟣" position="0 0.45 0" align="center" color="#FFEB3B"
                font="#bengali-font" width="3" side="double" scale="0.55 0.55 0.55"></a-text>
        <a-entity class="info-panel" visible="false" position="0 -0.65 0">
          <a-plane color="#1a1a2e" opacity="0.92" width="3.2" height="2.0">
            <a-text value="জড়ো হওয়ার স্থান
• নির্ধারিত মিলনস্থানে যান
• বিভাগ অনুযায়ী সারিবদ্ধ হন
• উপস্থিতি যাচাই করুন
• নিখোঁজ ব্যক্তি থাকলে জানান
• পুনরায় প্রবেশ করবেন না" position="-1.4 0.4 0.01" align="left" color="#ffffff"
                    font="#bengali-font" width="2.8" side="double" scale="0.5 0.5 0.5"></a-text>
          </a-plane>
        </a-entity>
      </a-entity>

      <!-- HOTSPOT 4: Emergency lighting (নীল) -->
      <a-entity position="-1.0 2.0 -2.5" class="clickable"
                geometry="primitive: sphere; radius: 0.15"
                material="color: #2196F3; emissive: #2196F3; emissiveIntensity: 0.2"
                animation__pulse="property: scale; to: 1.2 1.2 1.2; dur: 900; dir: alternate; loop: true"
                hotspot>
        <a-text value="জরুরি আলো 💡" position="0 0.45 0" align="center" color="#FFEB3B"
                font="#bengali-font" width="3" side="double" scale="0.55 0.55 0.55"></a-text>
        <a-entity class="info-panel" visible="false" position="0 -0.65 0">
          <a-plane color="#1a1a2e" opacity="0.92" width="3.2" height="2.0">
            <a-text value="জরুরি আলো (Emergency Light)

  <!-- ═══ JAVASCRIPT ═══ -->
  <script>
    (function() {

      // ── Component: hotspot ──
      // Click toggles info panel, hides others first
      AFRAME.registerComponent('hotspot', {
        init: function () {
          var self = this;
          this.el.addEventListener('click', function () {
            // Hide all panels in same scene
            var scene = self.el.closest('.scene');
            if (scene) {
              var panels = scene.querySelectorAll('.info-panel');
              for (var i = 0; i < panels.length; i++) {
                if (!self.el.contains(panels[i])) {
                  panels[i].setAttribute('visible', false);
                }
              }
            }
            // Toggle own panel
            var panel = self.el.querySelector('.info-panel');
            if (panel) {
              panel.setAttribute('visible', !panel.getAttribute('visible'));
            }
          });
        }
      });

      // ── Component: hazard ──
      // Same as hotspot + red flash effect on click
      AFRAME.registerComponent('hazard', {
        init: function () {
          var self = this;
          var originalColor = this.el.getAttribute('material').color;

          this.el.addEventListener('click', function () {
            // Hide other panels
            var scene = self.el.closest('.scene');
            if (scene) {
              var panels = scene.querySelectorAll('.info-panel');
              for (var i = 0; i < panels.length; i++) {
                if (!self.el.contains(panels[i])) {
                  panels[i].setAttribute('visible', false);
                }
              }
            }

            // Flash red
            self.el.setAttribute('material', 'color', '#FF0000');
            self.el.setAttribute('material', 'emissive', '#FF0000');
            self.el.setAttribute('material', 'emissiveIntensity', '0.8');

            setTimeout(function () {
              self.el.setAttribute('material', 'color', originalColor);
              self.el.setAttribute('material', 'emissive', originalColor);
              self.el.setAttribute('material', 'emissiveIntensity', '0.3');
            }, 400);

            // Toggle panel
            var panel = self.el.querySelector('.info-panel');
            if (panel) {
              panel.setAttribute('visible', !panel.getAttribute('visible'));
            }
          });
        }
      });

      // ── Component: nav-btn ──
      // Navigate to target scene
      AFRAME.registerComponent('nav-btn', {
        init: function () {
          var target = this.el.getAttribute('data-target');
          var self = this;
          this.el.addEventListener('click', function () {
            navigateToScene(target);
          });
        }
      });

      // ── Component: scene-btn ──
      // Same as nav-btn for start buttons
      AFRAME.registerComponent('scene-btn', {
        init: function () {
          var target = this.el.getAttribute('data-target');
          var self = this;
          this.el.addEventListener('click', function () {
            navigateToScene(target);
          });
        }
      });

      // ── Navigate function ──
      function navigateToScene(sceneId) {
        // Hide all scenes
        var scenes = document.querySelectorAll('.scene');
        for (var i = 0; i < scenes.length; i++) {
          scenes[i].setAttribute('visible', false);
        }

        // Show target scene
        var target = document.getElementById(sceneId);
        if (target) {
          target.setAttribute('visible', true);
        }

        // Reset camera (smoothly)
        var camera = document.querySelector('[camera]');
        if (camera) {
          camera.setAttribute('rotation', '0 0 0');
        }

        console.log('Navigated to scene:', sceneId);
      }

      // ── Auto-Guided Tour ──
      var tourActive = false;
      var tourTimer = null;
      var tourStep = 0;

      var tourItinerary = [
        // Each step: [sceneId, rotationY, delaySec, clickHotspot?]
        ["scene-1", -30, 6, true],     // PASS: Pin
        ["scene-1", 30, 6, true],      // PASS: Aim
        ["scene-1", 120, 5, true],     // Fire alarm
        ["scene-2", 0, 5, true],       // Evacuation: exit sign
        ["scene-2", 90, 5, true],      // Evacuation: floor markings
        ["scene-2", -60, 5, true],     // Assembly / fire door
        ["scene-3", 0, 5, true],       // Hazards: overload
        ["scene-3", 120, 5, true],     // Hazards: blocked extinguisher
        ["scene-3", -120, 5, true],    // Hazards: exposed wiring
        ["scene-complete", 0, 6, false]
      ];

      function startAutoTour() {
        if (tourActive) return;
        tourActive = true;
        tourStep = 0;
        document.getElementById('auto-tour-btn').setAttribute('material', 'color', '#757575');
        var tourText = document.querySelector('#auto-tour-btn a-text');
        if (tourText) tourText.setAttribute('value', '⏹ থামান');
        runTourStep();
      }

      function runTourStep() {
        if (!tourActive) return;
        if (tourStep >= tourItinerary.length) {
          stopAutoTour();
          return;
        }

        var step = tourItinerary[tourStep];
        var sceneId = step[0];
        var rotY = step[1];
        var delay = step[2] * 1000;
        var clickHotspot = step[3];

        // Navigate
        navigateToScene(sceneId);

        // Rotate camera
        setTimeout(function() {
          if (!tourActive) return;
          var cam = document.querySelector('[camera]');
          if (cam) cam.setAttribute('rotation', '0 ' + rotY + ' 0');
        }, 300);

        // Click a hotspot after a moment
        if (clickHotspot) {
          setTimeout(function() {
            if (!tourActive) return;
            var scene = document.getElementById(sceneId);
            if (scene) {
              var hotspots = scene.querySelectorAll('[hotspot], [hazard]');
              if (hotspots.length > 0) {
                var idx = tourStep % hotspots.length;
                hotspots[idx].dispatchEvent(new MouseEvent('click', {bubbles: true}));
              }
            }
          }, 1500);
        }

        // Schedule next step
        tourTimer = setTimeout(function() {
          tourStep++;
          runTourStep();
        }, delay);

        // Update status
        var tourText = document.querySelector('#auto-tour-btn a-text');
        if (tourText) {
          tourText.setAttribute('value', '⏹ থামান (' + (tourStep+1) + '/' + tourItinerary.length + ')');
        }
      }

      function stopAutoTour() {
        tourActive = false;
        if (tourTimer) {
          clearTimeout(tourTimer);
          tourTimer = null;
        }
        document.getElementById('auto-tour-btn').setAttribute('material', 'color', '#4CAF50');
        var tourText = document.querySelector('#auto-tour-btn a-text');
        if (tourText) tourText.setAttribute('value', '🔄 অটো ট্যুর');
      }

      // Wire auto-tour button
      AFRAME.registerComponent('auto-tour', {
        init: function () {
          var self = this;
          this.el.addEventListener('click', function () {
            if (!tourActive) {
              startAutoTour();
            } else {
              stopAutoTour();
            }
          });
        }
      });
      // Attach auto-tour component to the button
      document.getElementById('auto-tour-btn').setAttribute('auto-tour', '');

      console.log('🔥 NOSHTRI VR — Fire Safety Basics loaded');
    })();
  </script>
</body>
</html>
