<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>অগ্নি নিরাপত্তা মৌলিক বিষয় — Fire Safety Basics VR</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/aframe/1.6.0/aframe.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;700&display=swap');
    body { margin: 0; overflow: hidden; font-family: 'Noto Sans Bengali', sans-serif; }
  </style>
</head>
<body>
  <a-scene>
    <!-- ASSETS -->
    <a-assets>
      <!-- 360° photos generated by Gemini Pro Image — these are approximate equirectangular scenes -->
      <img id="sky-fire-extinguisher" src="assets/fire-extinguisher-area.jpg" crossorigin="anonymous">
      <img id="sky-evacuation" src="assets/evacuation-route.jpg" crossorigin="anonymous">
      <img id="sky-hazards" src="assets/fire-hazards.jpg" crossorigin="anonymous">

      <!-- Custom fonts -->
      <a-asset-item id="bengali-font" src="https://cdn.jsdelivr.net/gh/AwesomePixels/noto-sans-bengali@main/NotoSansBengali-Regular.woff2"></a-asset-item>
      <a-asset-item id="bengali-font-bold" src="https://cdn.jsdelivr.net/gh/AwesomePixels/noto-sans-bengali@main/NotoSansBengali-Bold.woff2"></a-asset-item>

      <!-- Audio assets -->
      <audio id="click-sound" src="https://cdn.jsdelivr.net/gh/noshtri/vr-sounds@main/click.mp3" crossorigin="anonymous"></audio>
    </a-assets>

    <!-- SCENE 0 — Intro/Welcome -->
    <a-entity id="scene-intro" class="scene" visible="true">
      <a-sky color="#1a237e"></a-sky>

      <a-entity position="0 2.0 -4">
        <a-text value="অগ্নি নিরাপত্তা মৌলিক বিষয়" align="center" color="#FF6F00" width="8"
                font="#bengali-font-bold" side="double" letterSpacing="2">
        </a-text>
      </a-entity>

      <a-entity position="0 1.0 -4">
        <a-text value="Fire Safety Basics" align="center" color="#ffffff" width="8"
                font="#bengali-font" side="double">
        </a-text>
      </a-entity>

      <a-entity position="0 -0.5 -4">
        <a-text value="একটি নিমজ্জিত VR প্রশিক্ষণ অভিজ্ঞতা" align="center" color="#B0BEC5" width="6"
                font="#bengali-font" side="double">
        </a-text>
      </a-entity>

      <a-entity position="0 -1.5 -4">
        <a-text value="NOSHTRI — বাংলাদেশে নিরাপদ কর্মক্ষেত্রের জন্য" align="center" color="#FFB74D" width="7"
                font="#bengali-font" side="double">
        </a-text>
      </a-entity>

      <!-- Start button -->
      <a-entity position="0 -3.2 -4" class="clickable scene-btn"
                geometry="primitive: plane; width: 2; height: 0.6"
                material="color: #FF6F00; side: double"
                animation__pulse="property: scale; to: 1.05 1.05 1.05; dur: 800; dir: alternate; loop: true"
                data-target="scene-1">
        <a-text value="শুরু করুন ▶" align="center" color="#ffffff" width="4"
                font="#bengali-font-bold" side="double">
        </a-text>
      </a-entity>

      <a-entity position="0 -4.0 -4">
        <a-text value="চারপাশে তাকাতে মাউস/স্ক্রিন টেনে আনুন • নীল বিন্দুতে gaze-click করুন" align="center"
                color="#78909C" width="8" font="#bengali-font" side="double" scale="0.6 0.6 0.6">
        </a-text>
      </a-entity>
    </a-entity>

    <!-- ========== SCENE 1: Fire Extinguisher Station ========== -->
    <a-entity id="scene-1" class="scene" visible="false">
      <a-sky src="#sky-fire-extinguisher" rotation="0 0 0"></a-sky>

      <!-- Scene title (top) -->
      <a-entity position="0 3.2 -1.5">
        <a-plane color="#000000" opacity="0.7" width="4" height="0.5" side="double"></a-plane>
        <a-text value="দৃশ্য ১: অগ্নি নির্বাপক স্টেশন" align="center" color="#FF6F00" width="4.5"
                font="#bengali-font-bold" side="double" position="0 0 0.01">
        </a-text>
      </a-entity>

      <!-- HOTSPOT 1: Fire Extinguisher (PASS method) -->
      <a-entity position="1.5 1.4 -2" class="clickable hotspot"
                geometry="primitive: sphere; radius: 0.18"
                material="color: #F44336; emissive: #F44336; emissiveIntensity: 0.3"
                animation__pulse="property: scale; to: 1.2 1.2 1.2; dur: 1000; dir: alternate; loop: true">
        <!-- Label -->
        <a-text value="অগ্নি নির্বাপক যন্ত্র" position="0 0.5 0" align="center"
                color="#FFEB3B" width="3" font="#bengali-font" side="double" scale="0.8 0.8 0.8">
        </a-text>
        <!-- Info panel (hidden initially) -->
        <a-entity class="info-panel" visible="false" position="0 -0.8 0">
          <a-plane color="#1a1a2e" opacity="0.92" width="3" height="2.5" side="double"
                   position="0 0.2 0"></a-plane>
          <a-text value="P.A.S.S. পদ্ধতি:" position="-1.3 1.8 0.01" align="left"
                  color="#FF6F00" width="2.8" font="#bengali-font-bold" side="double" scale="0.6 0.6 0.6">
          </a-text>
          <a-text value="P — Pull (পিন টানুন)
A — Aim (নিচে লক্ষ্য করুন)
S — Squeeze (চাপ দিন)
S — Sweep (পাশে চালান)

শুধুমাত্র ছোট আগুনে ব্যবহার করুন
জীবন ঝুঁকিতে নিজেকে বিপদে ফেলবেন না" position="-1.3 0.8 0.01" align="left"
                  color="#ffffff" width="2.8" font="#bengali-font" side="double" scale="0.5 0.5 0.5">
          </a-text>
        </a-entity>
      </a-entity>

      <!-- HOTSPOT 2: Fire Alarm -->
      <a-entity position="-1.2 1.8 -2.5" class="clickable hotspot"
                geometry="primitive: sphere; radius: 0.15"
                material="color: #2196F3; emissive: #2196F3; emissiveIntensity: 0.2"
                animation__pulse="property: scale; to: 1.2 1.2 1.2; dur: 1200; dir: alternate; loop: true">
        <a-text value="ফায়ার অ্যালার্ম" position="0 0.5 0" align="center"
                color="#FFEB3B" width="2.5" font="#bengali-font" side="double" scale="0.8 0.8 0.8">
        </a-text>
        <a-entity class="info-panel" visible="false" position="0 -0.8 0">
          <a-plane color="#1a1a2e" opacity="0.92" width="3" height="2.2" side="double"
                   position="0 0.2 0"></a-plane>
          <a-text value="ফায়ার অ্যালার্ম ব্যবহার:" position="-1.3 1.6 0.01" align="left"
                  color="#64B5F6" width="2.8" font="#bengali-font-bold" side="double" scale="0.6 0.6 0.6">
          </a-text>
          <a-text value="• আগুন দেখলেই অ্যালার্ম টিপুন
• সবাইকে সতর্ক করুন
• নির্ধারিত স্থানে জড়ো হন
• লিফট ব্যবহার করবেন না
• সব সময় সিঁড়ি ব্যবহার করুন" position="-1.3 0.3 0.01" align="left"
                  color="#ffffff" width="2.8" font="#bengali-font" side="double" scale="0.5 0.5 0.5">
          </a-text>
        </a-entity>
      </a-entity>

      <!-- HOTSPOT 3: Fire Hose Reel -->
      <a-entity position="2.5 0.8 -1.5" class="clickable hotspot"
                geometry="primitive: sphere; radius: 0.15"
                material="color: #4CAF50; emissive: #4CAF50; emissiveIntensity: 0.2"
                animation__pulse="property: scale; to: 1.2 1.2 1.2; dur: 900; dir: alternate; loop: true">
        <a-text value="ফায়ার হোজ রিল" position="0 0.5 0" align="center"
                color="#FFEB3B" width="2.5" font="#bengali-font" side="double" scale="0.8 0.8 0.8">
        </a-text>
        <a-entity class="info-panel" visible="false" position="0 -0.8 0">
          <a-plane color="#1a1a2e" opacity="0.92" width="3" height="2.0" side="double"
                   position="0 0.2 0"></a-plane>
          <a-text value="ফায়ার হোজ রিল:" position="-1.3 1.4 0.01" align="left"
                  color="#81C784" width="2.8" font="#bengali-font-bold" side="double" scale="0.6 0.6 0.6">
          </a-text>
          <a-text value="• পানি সরবরাহের জন্য
• বড় আগুন নেভাতে পারে
• ব্যবহারের আগে বিদ্যুৎ বন্ধ করুন
• বৈদ্যুতিক আগুনে ব্যবহার করবেন না
• পায়ের পাতার মোজাবিশেষ খুলুন
• ভালভ ঘুরিয়ে পানি দিন" position="-1.3 0.0 0.01" align="left"
                  color="#ffffff" width="2.8" font="#bengali-font" side="double" scale="0.5 0.5 0.5">
          </a-text>
        </a-entity>
      </a-entity>

      <!-- HOTSPOT 4: Sand Buckets -->
      <a-entity position="-2.8 0.3 -2" class="clickable hotspot"
                geometry="primitive: sphere; radius: 0.15"
                material="color: #FF9800; emissive: #FF9800; emissiveIntensity: 0.2"
                animation__pulse="property: scale; to: 1.2 1.2 1.2; dur: 1100; dir: alternate; loop: true">
        <a-text value="বালির বালতি" position="0 0.5 0" align="center"
                color="#FFEB3B" width="2.5" font="#bengali-font" side="double" scale="0.8 0.8 0.8">
        </a-text>
        <a-entity class="info-panel" visible="false" position="0 -0.8 0">
          <a-plane color="#1a1a2e" opacity="0.92" width="3" height="1.8" side="double"
                   position="0 0.1 0"></a-plane>
          <a-text value="বালির বালতি (Sand Buckets):" position="-1.3 1.2 0.01" align="left"
                  color="#FFB74D" width="2.8" font="#bengali-font-bold" side="double" scale="0.6 0.6 0.6">
          </a-text>
          <a-text value="• ছোট আগুন নেভাতে
• তেল/রাসায়নিক আগুনে কার্যকর
• অগ্নি নির্বাপকের পরিপূরক
• ফায়ার পয়েন্টে সবসময় রাখুন
• নিয়মিত বালি পরীক্ষা করুন" position="-1.3 -0.2 0.01" align="left"
                  color="#ffffff" width="2.8" font="#bengali-font" side="double" scale="0.5 0.5 0.5">
          </a-text>
        </a-entity>
      </a-entity>

      <!-- Scene navigation -->
      <a-entity position="-3.0 -2.5 -1.5" class="clickable nav-btn"
                geometry="primitive: plane; width: 1.2; height: 0.4"
                material="color: #1565C0; side: double"
                data-target="scene-intro">
        <a-text value="◀ ভূমিকা" align="center" color="#ffffff" width="2"
                font="#bengali-font" side="double" scale="0.7 0.7 0.7">
        </a-text>
      </a-entity>

      <a-entity position="3.0 -2.5 -1.5" class="clickable nav-btn"
                geometry="primitive: plane; width: 1.2; height: 0.4"
                material="color: #FF6F00; side: double"
                data-target="scene-2">
        <a-text value="পরবর্তী ▶" align="center" color="#ffffff" width="2"
                font="#bengali-font" side="double" scale="0.7 0.7 0.7">
        </a-text>
      </a-entity>
    </a-entity>

    <!-- ========== SCENE 2: Evacuation Route ========== -->
    <a-entity id="scene-2" class="scene" visible="false">
      <a-sky src="#sky-evacuation" rotation="0 0 0"></a-sky>

      <a-entity position="0 3.2 -1.5">
        <a-plane color="#000000" opacity="0.7" width="4" height="0.5" side="double"></a-plane>
        <a-text value="দৃশ্য ২: জরুরি প্রস্থান ও উদ্ধার পথ" align="center" color="#4CAF50" width="4.5"
                font="#bengali-font-bold" side="double" position="0 0 0.01">
        </a-text>
      </a-entity>

      <!-- HOTSPOT 1: Emergency Exit Sign -->
      <a-entity position="0.5 2.4 -3" class="clickable hotspot"
                geometry="primitive: sphere; radius: 0.18"
                material="color: #4CAF50; emissive: #4CAF50; emissiveIntensity: 0.3"
                animation__pulse="property: scale; to: 1.2 1.2 1.2; dur: 1000; dir: alternate; loop: true">
        <a-text value="জরুরি প্রস্থান চিহ্ন" position="0 0.55 0" align="center"
                color="#FFEB3B" width="3" font="#bengali-font" side="double" scale="0.8 0.8 0.8">
        </a-text>
        <a-entity class="info-panel" visible="false" position="0 -0.8 0">
          <a-plane color="#1a1a2e" opacity="0.92" width="3" height="2.2" side="double"
                   position="0 0.2 0"></a-plane>
          <a-text value="জরুরি প্রস্থান (Exit):" position="-1.3 1.6 0.01" align="left"
                  color="#81C784" width="2.8" font="#bengali-font-bold" side="double" scale="0.6 0.6 0.6">
          </a-text>
          <a-text value="• সবুজ EXIT চিহ্ন অনুসরণ করুন
• প্রস্থানের পথ সবসময় পরিষ্কার রাখুন
• দরজায় তালা লাগানো যাবে না
• প্রস্থান পথে কিছু রাখবেন না
• সব সময় প্রস্থানের অবস্থান জানুন" position="-1.3 0.3 0.01" align="left"
                  color="#ffffff" width="2.8" font="#bengali-font" side="double" scale="0.5 0.5 0.5">
          </a-text>
        </a-entity>
      </a-entity>

      <!-- HOTSPOT 2: Evacuation Floor Markings -->
      <a-entity position="0.8 0.3 -3" class="clickable hotspot"
                geometry="primitive: sphere; radius: 0.15"
                material="color: #FFEB3B; emissive: #FFEB3B; emissiveIntensity: 0.2"
                animation__pulse="property: scale; to: 1.2 1.2 1.2; dur: 900; dir: alternate; loop: true">
        <a-text value="উদ্ধার পথ নির্দেশিকা" position="0 0.5 0" align="center"
                color="#FFEB3B" width="3" font="#bengali-font" side="double" scale="0.8 0.8 0.8">
        </a-text>
        <a-entity class="info-panel" visible="false" position="0 -0.8 0">
          <a-plane color="#1a1a2e" opacity="0.92" width="3" height="2.0" side="double"
                   position="0 0.1 0"></a-plane>
          <a-text value="উদ্ধার পথ নির্দেশিকা:" position="-1.3 1.4 0.01" align="left"
                  color="#FFD54F" width="2.8" font="#bengali-font-bold" side="double" scale="0.6 0.6 0.6">
          </a-text>
          <a-text value="• মেঝেতে তীর চিহ্ন অনুসরণ করুন
• সবুজ ফটোলুমিনেসেন্ট লাইন
• অন্ধকারেও দেখা যায়
• নিরাপদ প্রস্থানের পথ নির্দেশ করে
• ধূমপানের সময় হামাগুড়ি দিয়ে যান" position="-1.3 0.0 0.01" align="left"
                  color="#ffffff" width="2.8" font="#bengali-font" side="double" scale="0.5 0.5 0.5">
          </a-text>
        </a-entity>
      </a-entity>

      <!-- HOTSPOT 3: Assembly Point -->
      <a-entity position="-2.0 1.0 -2.5" class="clickable hotspot"
                geometry="primitive: sphere; radius: 0.15"
                material="color: #9C27B0; emissive: #9C27B0; emissiveIntensity: 0.2"
                animation__pulse="property: scale; to: 1.2 1.2 1.2; dur: 1100; dir: alternate; loop: true">
        <a-text value="জড়ো হওয়ার স্থান" position="0 0.5 0" align="center"
                color="#FFEB3B" width="3" font="#bengali-font" side="double" scale="0.8 0.8 0.8">
        </a-text>
        <a-entity class="info-panel" visible="false" position="0 -0.8 0">
          <a-plane color="#1a1a2e" opacity="0.92" width="3" height="2.2" side="double"
                   position="0 0.2 0"></a-plane>
          <a-text value="জড়ো হওয়ার স্থান (Assembly):" position="-1.3 1.6 0.01" align="left"
                  color="#CE93D8" width="2.8" font="#bengali-font-bold" side="double" scale="0.6 0.6 0.6">
          </a-text>
          <a-text value="• নির্ধারিত মিলনস্থানে যান
• বিভাগ অনুযায়ী সারিবদ্ধ হন
• উপস্থিতি যাচাই করুন
• কাউকে নিখোঁজ হলে জানান
• পুনরায় প্রবেশ করবেন না" position="-1.3 0.3 0.01" align="left"
                  color="#ffffff" width="2.8" font="#bengali-font" side="double" scale="0.5 0.5 0.5">
          </a-text>
        </a-entity>
      </a-entity>

      <!-- HOTSPOT 4: Emergency Lighting -->
      <a-entity position="-1.5 2.8 -2" class="clickable hotspot"
                geometry="primitive: sphere; radius: 0.15"
                material="color: #00BCD4; emissive: #00BCD4; emissiveIntensity: 0.2"
                animation__pulse="property: scale; to: 1.2 1.2 1.2; dur: 1300; dir: alternate; loop: true">
        <a-text value="জরুরি আলো" position="0 0.5 0" align="center"
                color="#FFEB3B" width="2" font="#bengali-font" side="double" scale="0.8 0.8 0.8">
        </a-text>
        <a-entity class="info-panel" visible="false" position="0 -0.8 0">
          <a-plane color="#1a1a2e" opacity="0.92" width="3" height="1.8" side="double"
                   position="0 0.1 0"></a-plane>
          <a-text value="জরুরি আলো (Emergency Light):" position="-1.3 1.2 0.01" align="left"
                  color="#4DD0E1" width="2.8" font="#bengali-font-bold" side="double" scale="0.6 0.6 0.6">
          </a-text>
          <a-text value="• বিদ্যুৎ গেলে স্বয়ংক্রিয়ভাবে জ্বলে
• প্রস্থান পথ আলোকিত রাখে
• নিয়মিত পরীক্ষা করুন (মাসিক)
• ব্যাটারি চেক করুন
• ৯০ মিনিট পর্যন্ত আলো দেয়" position="-1.3 -0.2 0.01" align="left"
                  color="#ffffff" width="2.8" font="#bengali-font" side="double" scale="0.5 0.5 0.5">
          </a-text>
        </a-entity>
      </a-entity>

      <!-- HOTSPOT 5: Fire Door -->
      <a-entity position="3.0 1.2 -2" class="clickable hotspot"
                geometry="primitive: sphere; radius: 0.15"
                material="color: #795548; emissive: #795548; emissiveIntensity: 0.2"
                animation__pulse="property: scale; to: 1.2 1.2 1.2; dur: 950; dir: alternate; loop: true">
        <a-text value="ফায়ার ডোর" position="0 0.5 0" align="center"
                color="#FFEB3B" width="2" font="#bengali-font" side="double" scale="0.8 0.8 0.8">
        </a-text>
        <a-entity class="info-panel" visible="false" position="0 -0.8 0">
          <a-plane color="#1a1a2e" opacity="0.92" width="3" height="2.0" side="double"
                   position="0 0.1 0"></a-plane>
          <a-text value="ফায়ার ডোর (Fire Door):" position="-1.3 1.4 0.01" align="left"
                  color="#A1887F" width="2.8" font="#bengali-font-bold" side="double" scale="0.6 0.6 0.6">
          </a-text>
          <a-text value="• আগুন ও ধোঁয়া ছড়াতে বাধা দেয়
• স্বয়ংক্রিয়ভাবে বন্ধ হয়
• কখনোই খোলা রাখবেন না

  <script>
    // ============ A-Frame Components ============

    // ---- Hotspot click: toggle info panel ----
    AFRAME.registerComponent('hotspot', {
      init: function () {
        var el = this.el;
        el.addEventListener('click', function (evt) {
          var panel = this.querySelector('.info-panel');
          if (panel) {
            var visible = panel.getAttribute('visible');
            // Hide all other panels first
            document.querySelectorAll('.info-panel').forEach(function (p) {
              p.setAttribute('visible', false);
            });
            panel.setAttribute('visible', !visible);
            // Pulse animation on click feedback
            el.setAttribute('animation__click', {
              property: 'scale',
              to: '1.4 1.4 1.4',
              dur: 200,
              dir: 'alternate',
              loop: 1
            });
          }
          // Prevent event from propagating to scene buttons
          evt.stopPropagation();
        });

        // Also handle touch for mobile
        el.addEventListener('touchstart', function (evt) {
          evt.preventDefault();
          el.emit('click');
        });
      }
    });

    // ---- Scene Navigation ----
    AFRAME.registerComponent('nav-btn', {
      init: function () {
        var el = this.el;
        var target = el.getAttribute('data-target');
        el.addEventListener('click', function (evt) {
          if (target) navigateToScene(target);
          evt.stopPropagation();
        });
      }
    });

    AFRAME.registerComponent('scene-btn', {
      init: function () {
        var el = this.el;
        var target = el.getAttribute('data-target');
        el.addEventListener('click', function (evt) {
          if (target) navigateToScene(target);
          evt.stopPropagation();
        });
      }
    });

    // ---- Navigation function ----
    function navigateToScene(sceneId) {
      // Hide all scenes
      document.querySelectorAll('.scene').forEach(function (s) {
        s.setAttribute('visible', false);
      });
      // Show target scene
      var target = document.getElementById(sceneId);
      if (target) {
        target.setAttribute('visible', true);
      }
      // Reset camera to center
      var camera = document.querySelector('[camera]');
      if (camera) {
        camera.setAttribute('rotation', '0 0 0');
      }
      // Hide all info panels
      document.querySelectorAll('.info-panel').forEach(function (p) {
        p.setAttribute('visible', false);
      });
    }

    // ---- Handle hazard hotspot (same as hotspot but red pulse on click) ----
    AFRAME.registerComponent('hazard', {
      init: function () {
        var el = this.el;
        el.addEventListener('click', function (evt) {
          var panel = this.querySelector('.info-panel');
          if (panel) {
            var visible = panel.getAttribute('visible');
            document.querySelectorAll('.info-panel').forEach(function (p) {
              p.setAttribute('visible', false);
            });
            panel.setAttribute('visible', !visible);
            // Red danger flash
            el.setAttribute('material', 'emissiveIntensity', 0.8);
            setTimeout(function () {
              el.setAttribute('material', 'emissiveIntensity', 0.3);
            }, 300);
          }
          evt.stopPropagation();
        });
        el.addEventListener('touchstart', function (evt) {
          evt.preventDefault();
          el.emit('click');
        });
      }
    });

    console.log('🔥 Fire Safety VR — NOSHTRI Training loaded successfully');
  </script>
