  <script>
    (function() {
      // ── Scene IDs ──
      var ALL_SCENES = ['scene-intro', 'scene-1', 'scene-2', 'scene-3', 'scene-complete'];

      // ── Component: hotspot (toggle panel, hide siblings) ──
      AFRAME.registerComponent('hotspot', {
        init: function () {
          var self = this;
          this.el.addEventListener('click', function () {
            var scene = self.el.closest('.scene');
            if (scene) {
              var panels = scene.querySelectorAll('.info-panel');
              for (var i = 0; i < panels.length; i++) {
                if (!self.el.contains(panels[i])) {
                  panels[i].setAttribute('visible', false);
                }
              }
            }
            var panel = self.el.querySelector('.info-panel');
            if (panel) {
              panel.setAttribute('visible', !panel.getAttribute('visible'));
            }
          });
        }
      });

      // ── Component: hazard (flash red + toggle panel) ──
      AFRAME.registerComponent('hazard', {
        init: function () {
          var self = this;
          var mat = self.el.getAttribute('material');
          var originalColor = mat && mat.color ? mat.color : '#FF9800';
          this.el.addEventListener('click', function () {
            var scene = self.el.closest('.scene');
            if (scene) {
              var panels = scene.querySelectorAll('.info-panel');
              for (var i = 0; i < panels.length; i++) {
                if (!self.el.contains(panels[i])) {
                  panels[i].setAttribute('visible', false);
                }
              }
            }
            // Flash red
            self.el.setAttribute('material', 'color', '#FF0000');
            self.el.setAttribute('material', 'emissive', '#FF0000');
            self.el.setAttribute('material', 'emissiveIntensity', '0.8');
            setTimeout(function () {
              self.el.setAttribute('material', 'color', originalColor);
              self.el.setAttribute('material', 'emissive', originalColor);
              self.el.setAttribute('material', 'emissiveIntensity', '0.3');
            }, 400);
            var panel = self.el.querySelector('.info-panel');
            if (panel) {
              panel.setAttribute('visible', !panel.getAttribute('visible'));
            }
          });
        }
      });

      // ── Component: nav-btn ──
      AFRAME.registerComponent('nav-btn', {
        init: function () {
          var target = this.el.getAttribute('data-target');
          this.el.addEventListener('click', function () {
            navigateToScene(target);
          });
        }
      });

      // ── Component: scene-btn (same as nav-btn) ──
      AFRAME.registerComponent('scene-btn', {
        init: function () {
          var target = this.el.getAttribute('data-target');
          this.el.addEventListener('click', function () {
            navigateToScene(target);
          });
        }
      });

      // ── Component: restart-btn ──
      AFRAME.registerComponent('restart-btn', {
        init: function () {
          this.el.addEventListener('click', function () {
            if (typeof stopAutoTour === 'function') stopAutoTour();
            navigateToScene('scene-intro');
          });
        }
      });

      // ── Navigate function ──
      function navigateToScene(sceneId) {
        for (var i = 0; i < ALL_SCENES.length; i++) {
          var el = document.getElementById(ALL_SCENES[i]);
          if (el) el.setAttribute('visible', false);
        }
        var panels = document.querySelectorAll('.info-panel');
        for (var j = 0; j < panels.length; j++) {
          panels[j].setAttribute('visible', false);
        }
        var target = document.getElementById(sceneId);
        if (target) target.setAttribute('visible', true);
        var cam = document.querySelector('[camera]');
        if (cam) cam.setAttribute('rotation', '0 0 0');
        console.log('Navigated to:', sceneId);
      }

      // ── Auto-Guided Tour ──
      var tourActive = false, tourTimer = null, tourStep = 0;
      var tourItinerary = [
        ['scene-1', -30, 7, true], ['scene-1', 30, 6, true], ['scene-1', 120, 6, true],
        ['scene-2', 0, 7, true], ['scene-2', 90, 6, true], ['scene-2', -60, 6, true],
        ['scene-3', 0, 7, true], ['scene-3', 120, 6, true], ['scene-3', -120, 6, true],
        ['scene-complete', 0, 8, false]
      ];

      function startAutoTour() {
        if (tourActive) return;
        tourActive = true; tourStep = 0;
        navigateToScene('scene-1');
        var btn = document.getElementById('auto-tour-btn');
        if (btn) {
          btn.setAttribute('material', 'color', '#757575');
          var t = btn.querySelector('a-text');
          if (t) t.setAttribute('value', '\u23F9 \u09A5\u09BE\u09AE\u09BE\u09A8');
        }
        runTourStep();
      }

      function runTourStep() {
        if (!tourActive) return;
        if (tourStep >= tourItinerary.length) { stopAutoTour(); return; }
        var step = tourItinerary[tourStep];
        var sceneId = step[0], rotY = step[1], delay = step[2] * 1000, clickH = step[3];
        navigateToScene(sceneId);
        setTimeout(function() {
          if (!tourActive) return;
          var cam = document.querySelector('[camera]');
          if (cam) cam.setAttribute('rotation', '0 ' + rotY + ' 0');
        }, 300);
        if (clickH) {
          setTimeout(function() {
            if (!tourActive) return;
            var sc = document.getElementById(sceneId);
            if (sc) {
              var hs = sc.querySelectorAll('[hotspot], [hazard]');
              if (hs.length > 0) {
                try { hs[tourStep % hs.length].dispatchEvent(new MouseEvent('click', {bubbles: true})); } catch(e) {}
              }
            }
          }, 1500);
        }
        tourTimer = setTimeout(function() {
          tourStep++;
          runTourStep();
          var btn = document.getElementById('auto-tour-btn');
          if (btn) {
            var t = btn.querySelector('a-text');
            if (t) t.setAttribute('value', '\u23F9 \u09A5\u09BE\u09AE\u09BE\u09A8 (' + (tourStep+1) + '/' + tourItinerary.length + ')');
          }
        }, delay);
      }

      function stopAutoTour() {
        tourActive = false;
        if (tourTimer) { clearTimeout(tourTimer); tourTimer = null; }
        var btn = document.getElementById('auto-tour-btn');
        if (btn) {
          btn.setAttribute('material', 'color', '#4CAF50');
          var t = btn.querySelector('a-text');
          if (t) t.setAttribute('value', '\uD83D\uDD04 \u0985\u099F\u09CB \u099F\u09CD\u09AF\u09C1\u09B0');
        }
      }

      AFRAME.registerComponent('auto-tour', {
        init: function () {
          this.el.addEventListener('click', function () {
            if (!tourActive) startAutoTour(); else stopAutoTour();
          });
        }
      });

      setTimeout(function() {
        var btn = document.getElementById('auto-tour-btn');
        if (btn) btn.setAttribute('auto-tour', '');
      }, 500);

      console.log('Fire Hazard Hunt VR loaded');
    })();
  </script>
