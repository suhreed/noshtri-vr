<!DOCTYPE html>

পরিবর্তন করুন" position="-1.4 0.8 0.01" align="left" color="#ffffff"

      <!-- Nav -->

  <!-- ═══ JAVASCRIPT ═══ -->
  <script>
    (function() {

      // ── Component: hotspot ──
      AFRAME.registerComponent('hotspot', {
        init: function () {
          var self = this;
          this.el.addEventListener('click', function () {
            var scene = self.el.closest('.scene');
            if (scene) {
              var panels = scene.querySelectorAll('.info-panel');
              for (var i = 0; i < panels.length; i++) {
                if (!self.el.contains(panels[i])) {
                  panels[i].setAttribute('visible', false);
                }
              }
            }
            var panel = self.el.querySelector('.info-panel');
            if (panel) {
              panel.setAttribute('visible', !panel.getAttribute('visible'));
            }
          });
        }
      });

      // ── Component: hazard ──
      AFRAME.registerComponent('hazard', {
        init: function () {
          var self = this;
          var originalColor = this.el.getAttribute('material').color;
          this.el.addEventListener('click', function () {
            var scene = self.el.closest('.scene');
            if (scene) {
              var panels = scene.querySelectorAll('.info-panel');
              for (var i = 0; i < panels.length; i++) {
                if (!self.el.contains(panels[i])) {
                  panels[i].setAttribute('visible', false);
                }
              }
            }
            self.el.setAttribute('material', 'color', '#FF0000');
            self.el.setAttribute('material', 'emissive', '#FF0000');
            self.el.setAttribute('material', 'emissiveIntensity', '0.8');
            setTimeout(function () {
              self.el.setAttribute('material', 'color', originalColor);
              self.el.setAttribute('material', 'emissive', originalColor);
              self.el.setAttribute('material', 'emissiveIntensity', '0.3');
            }, 400);
            var panel = self.el.querySelector('.info-panel');
            if (panel) {
              panel.setAttribute('visible', !panel.getAttribute('visible'));
            }
          });
        }
      });

      // ── Component: nav-btn ──
      AFRAME.registerComponent('nav-btn', {
        init: function () {
          var target = this.el.getAttribute('data-target');
          this.el.addEventListener('click', function () {
            navigateToScene(target);
          });
        }
      });

      // ── Component: scene-btn ──
      AFRAME.registerComponent('scene-btn', {
        init: function () {
          var target = this.el.getAttribute('data-target');
          this.el.addEventListener('click', function () {
            navigateToScene(target);
          });
        }
      });

      // ── Navigate function ──
      function navigateToScene(sceneId) {
        var scenes = document.querySelectorAll('.scene');
        for (var i = 0; i < scenes.length; i++) {
          scenes[i].setAttribute('visible', false);
        }
        var target = document.getElementById(sceneId);
        if (target) {
          target.setAttribute('visible', true);
        }
        var camera = document.querySelector('[camera]');
        if (camera) {
          camera.setAttribute('rotation', '0 0 0');
        }
        console.log('Navigated to scene:', sceneId);
      }

      // ── Auto-Guided Tour ──
      var tourActive = false;
      var tourTimer = null;
      var tourStep = 0;

      var tourItinerary = [
        ["scene-1", -30, 6, true],      // Helmet + goggles
        ["scene-1", 60, 6, true],       // Ear plugs + mask
        ["scene-1", 150, 5, true],      // Vest/gloves/boots
        ["scene-2", 0, 5, true],        // No helmet + no glasses
        ["scene-2", 90, 5, true],       // No gloves + loose sleeves
        ["scene-2", -90, 5, true],      // No boots + no ear plugs
        ["scene-3", 0, 5, true],        // PPE cabinet + inspection
        ["scene-3", 90, 5, true],       // Sign-out + disposal
        ["scene-3", -60, 5, true],      // Safety poster
        ["scene-complete", 0, 6, false]
      ];

      function startAutoTour() {
        if (tourActive) return;
        tourActive = true;
        tourStep = 0;
        document.getElementById('auto-tour-btn').setAttribute('material', 'color', '#757575');
        var tourText = document.querySelector('#auto-tour-btn a-text');
        if (tourText) tourText.setAttribute('value', '⏹ থামান');
        runTourStep();
      }

      function runTourStep() {
        if (!tourActive) return;
        if (tourStep >= tourItinerary.length) {
          stopAutoTour();
          return;
        }
        var step = tourItinerary[tourStep];
        var sceneId = step[0], rotY = step[1], delay = step[2] * 1000, clickHotspot = step[3];

        navigateToScene(sceneId);
        setTimeout(function() {
          if (!tourActive) return;
          var cam = document.querySelector('[camera]');
          if (cam) cam.setAttribute('rotation', '0 ' + rotY + ' 0');
        }, 300);

        if (clickHotspot) {
          setTimeout(function() {
            if (!tourActive) return;
            var scene = document.getElementById(sceneId);
            if (scene) {
              var hotspots = scene.querySelectorAll('[hotspot], [hazard]');
              if (hotspots.length > 0) {
                var idx = tourStep % hotspots.length;
                hotspots[idx].dispatchEvent(new MouseEvent('click', {bubbles: true}));
              }
            }
          }, 1500);
        }

        tourTimer = setTimeout(function() {
          tourStep++;
          runTourStep();
        }, delay);

        var tourText = document.querySelector('#auto-tour-btn a-text');
        if (tourText) {
          tourText.setAttribute('value', '⏹ থামান (' + (tourStep+1) + '/' + tourItinerary.length + ')');
        }
      }

      function stopAutoTour() {
        tourActive = false;
        if (tourTimer) { clearTimeout(tourTimer); tourTimer = null; }
        document.getElementById('auto-tour-btn').setAttribute('material', 'color', '#4CAF50');
        var tourText = document.querySelector('#auto-tour-btn a-text');
        if (tourText) tourText.setAttribute('value', '🔄 অটো ট্যুর');
      }

      // Wire auto-tour button
      AFRAME.registerComponent('auto-tour', {
        init: function () {
          this.el.addEventListener('click', function () {
            if (!tourActive) startAutoTour();
            else stopAutoTour();
          });
        }
      });
      document.getElementById('auto-tour-btn').setAttribute('auto-tour', '');

      console.log('🥽 NOSHTRI VR — PPE Training loaded');
    })();
  </script>
</body>
</html>
